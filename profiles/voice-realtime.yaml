apiVersion: klankermaker.ai/v1alpha2
kind: SandboxProfile
metadata:
  name: voice-realtime
  labels:
    tier: demo
    kind: realtime-voice
  # Realtime voice AI demo — the "best cascade" from the HF/Cerebras reference
  # blog, with premium streaming pieces swapped in:
  #   FastRTC (WebRTC + Silero VAD + barge-in)  ->  Deepgram STT
  #   ->  Cerebras/Groq LLM (streamed)          ->  ElevenLabs Flash v2.5 TTS
  # Full source + architecture: demos/voice-realtime/README.md.
  #
  # NO GPU: every heavy piece is an external streaming API, so this is a cheap
  # CPU box whose whole job is orchestration. km provisions it, injects the keys
  # via SOPS, gates egress to just the vendors, and meters compute.
  #
  # Exposed publicly via an ngrok tunnel (ngrok connects over 443 — cloudflared
  # needs port 7844, which km's SG blocks). WebRTC media relays via Cloudflare
  # TURN over TLS/443 (FastRTC's HF-token helper), since the sandbox has no
  # inbound + no UDP. enforcement:ebpf (SNI allowlist, NO MITM) so TURN-over-TLS
  # and the HTTP-streaming API calls pass through uninspected.

extends:
  - base/os/debian        # ubuntu-24.04 + python3/pip/git/jq (apt over HTTPS)
  - base/platform         # sidecars, observability, budget, iam, agent config

spec:
  runtime:
    instanceType: t3.large   # 2 vCPU / 8 GB — plenty for orchestration + Silero VAD
    region: us-east-1
    spot: false              # a demo wants to stay up; on-demand is steadier
    hibernation: false
    substrate: ec2

  lifecycle:
    ttl: "6h"
    idleTimeout: "1h"
    teardownPolicy: stop

  budget:
    compute:
      maxSpendUSD: 5.00      # t3.large ~$0.083/hr; the STT/LLM/TTS spend is on the vendors' bills, not km's
    ai:
      maxSpendUSD: 0.10      # km meters Bedrock/Anthropic/OpenAI only — none used here

  # Purpose-built egress allowlist. enforcement:ebpf = SNI/DNS allowlist with NO
  # MITM interception, which is required for (a) Cloudflare TURN-over-TLS and
  # (b) native HTTP streaming to the voice vendors. If boot ever fails on egress,
  # temporarily swap this whole block for `extends: [..., base/network/safenetwork]`
  # (allow "*") to isolate the offending host.
  network:
    enforcement: ebpf
    egress:
      allowedDNSSuffixes:
        - ".amazonaws.com"        # REQUIRED: SSM agent, S3 sidecar/artifact fetch, KMS (SOPS decrypt)
        - "time.aws.com"          # NTP
        - ".ubuntu.com"           # apt (archive + security)
        - ".pypi.org"             # pip
        - ".pythonhosted.org"     # pip wheels
        - ".githubusercontent.com" # pip/git raw assets
        - ".github.com"           # (some wheels/redirects)
        - ".huggingface.co"       # FastRTC Silero VAD model + Cloudflare TURN token broker
        - ".hf.co"
        - ".deepgram.com"         # STT
        - ".elevenlabs.io"        # TTS
        - ".cerebras.ai"          # LLM (primary)
        - ".groq.com"             # LLM (fallback)
        - ".cloudflare.com"       # WebRTC TURN relay (turns:443)
        - ".ngrok.com"            # public tunnel control plane
        - ".ngrok-agent.com"
        - ".ngrok.io"
        - ".ngrok-free.app"       # the public demo URL (free tier)
        - ".equinox.io"           # ngrok binary download
      allowedHosts:
        - "*"                     # host-level list left open; the suffix list above is the real gate

  # API keys arrive via SOPS (KMS-decrypted to /etc/sandbox-secrets.env at boot;
  # the sandbox role gets kms:Decrypt automatically when sopsFile is set). The
  # systemd units below read that file directly via EnvironmentFile.
  # Create the bundle (see demos/voice-realtime/README.md):
  #   DEEPGRAM_API_KEY / ELEVENLABS_API_KEY / CEREBRAS_API_KEY (or GROQ_API_KEY)
  #   HF_TOKEN (for TURN) / NGROK_AUTHTOKEN (for the tunnel)
  secrets:
    sopsFile: ./secrets/voice.enc.yaml

  # No repo access needed — this box orchestrates APIs, it doesn't clone code.
  sourceAccess:
    mode: none

  execution:
    shell: /bin/bash
    workingDir: /workspace

    # Bring-up runs AFTER base initCommands (python/pip/apt are already present).
    # app.py + requirements.txt + announce-url.sh are delivered base64-embedded so
    # the profile is fully self-contained (no repo clone at boot). Regenerate after
    # editing demos/voice-realtime/*:
    #   base64 -w0 demos/voice-realtime/app.py
    #   base64 -w0 demos/voice-realtime/requirements.txt
    #   base64 -w0 demos/voice-realtime/announce-url.sh
    initCommandsAppend:
      # 1. Runtime libs: venv support + opus (aiortc audio) + ffmpeg (PyAV).
      - "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-venv libopus0 ffmpeg || true"

      # 2. Deliver the app (base64 -> files under /opt/km-voice).
      - "mkdir -p /opt/km-voice"
      - "echo '' | base64 -d > /opt/km-voice/app.py"
      - "echo '' | base64 -d > /opt/km-voice/requirements.txt"
      - "echo '' | base64 -d > /opt/km-voice/announce-url.sh && chmod +x /opt/km-voice/announce-url.sh"

      # 3. Python env + deps (pip from pypi; the slow step, a few minutes).
      - "python3 -m venv /opt/km-voice/.venv && /opt/km-voice/.venv/bin/pip install --upgrade pip && /opt/km-voice/.venv/bin/pip install -r /opt/km-voice/requirements.txt"

      # 4. ngrok (connects to its edge over 443 — fits km's SG; cloudflared's 7844 does not).
      - "curl -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o /tmp/ngrok.tgz && tar -xzf /tmp/ngrok.tgz -C /usr/local/bin && chmod +x /usr/local/bin/ngrok || true"

      # 5. systemd units. All read /etc/sandbox-secrets.env (SOPS-decrypted dotenv)
      #    for the API keys / HF_TOKEN / NGROK_AUTHTOKEN.
      - |
        cat > /etc/systemd/system/km-voice.service <<'KM_VOICE_UNIT'
        [Unit]
        Description=km realtime voice service (FastRTC streaming cascade)
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=simple
        WorkingDirectory=/opt/km-voice
        EnvironmentFile=-/etc/sandbox-secrets.env
        Environment=HOST=127.0.0.1
        Environment=PORT=8000
        ExecStart=/opt/km-voice/.venv/bin/python /opt/km-voice/app.py
        Restart=on-failure
        RestartSec=10
        [Install]
        WantedBy=multi-user.target
        KM_VOICE_UNIT
      - |
        cat > /etc/systemd/system/km-tunnel.service <<'KM_TUNNEL_UNIT'
        [Unit]
        Description=km public tunnel (ngrok -> loopback :8000)
        After=km-voice.service network-online.target
        Wants=km-voice.service network-online.target
        [Service]
        Type=simple
        EnvironmentFile=-/etc/sandbox-secrets.env
        ExecStart=/usr/local/bin/ngrok http 8000 --log stdout --log-format logfmt
        Restart=on-failure
        RestartSec=10
        [Install]
        WantedBy=multi-user.target
        KM_TUNNEL_UNIT
      - |
        cat > /etc/systemd/system/km-voice-url.service <<'KM_URL_UNIT'
        [Unit]
        Description=km voice public-URL capture/announce
        After=km-tunnel.service
        Wants=km-tunnel.service
        [Service]
        Type=oneshot
        RemainAfterExit=true
        ExecStart=/opt/km-voice/announce-url.sh
        KM_URL_UNIT

      # 6. Start everything.
      - "systemctl daemon-reload"
      - "systemctl enable --now km-voice.service || true"
      - "systemctl enable --now km-tunnel.service || true"
      - "systemctl enable --now km-voice-url.service || true"
