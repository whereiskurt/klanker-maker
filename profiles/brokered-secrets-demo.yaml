# Demo profile for brokered secret unsealing (Phase 133). This is the worked
# example docs/brokered-secrets.md points at.
#
# WHAT CHANGED. Before Phase 133 a SOPS bundle was decrypted at boot into
# /etc/sandbox-secrets.env and auto-exported into every login shell — so malware
# dumping `env` or /proc/*/environ got the whole bundle. Now km-secretsd (a root
# daemon) holds the ciphertext, decrypts per request via KMS, zeroes its buffers,
# and serves only what a named consumer is granted over a unix socket. km-env
# execve's ONE command with those keys. Root-owned shims in /opt/km/shims (first
# on PATH) route claude/codex through km-env, so the AGENT PROCESS receives
# secrets and the turn shell does not.
#
# THE POINT OF THIS PROFILE is the `grants:` block: the two consumers here get
# DIFFERENT subsets, which is what proves grants actually narrow rather than
# passing the bundle through. Verified live: claude sees OPENAI_API_KEY absent,
# codex sees ANTHROPIC_API_KEY absent, and a login shell sees neither.
#
# BEFORE YOU RUN IT you must create the bundle it references. The path is
# relative to THIS FILE, so it resolves to profiles/secrets/brokered-demo.enc.yaml:
#
#   mkdir -p profiles/secrets
#   cat > /tmp/demo.yaml <<'EOF'
#   ANTHROPIC_API_KEY: sk-ant-...
#   OPENAI_API_KEY: sk-proj-...
#   EOF
#   # NOTE: run sops from OUTSIDE the repo — the repo's .sops.yaml creation rule
#   # only matches secrets/*.enc.yaml and is matched against the INPUT path, so
#   # encrypting /tmp/demo.yaml from the repo root fails with
#   # "error loading config: no matching creation rules found".
#   (cd /tmp && sops --encrypt \
#      --kms 'arn:aws:kms:us-east-1:<account-id>:alias/km-sandbox-secrets' \
#      --input-type yaml --output-type yaml demo.yaml) \
#      > profiles/secrets/brokered-demo.enc.yaml
#   rm /tmp/demo.yaml
#
# TRY IT, once the sandbox is up:
#
#   km shell <id>
#   env | grep -c API_KEY          # 0 — the whole point
#   command -v claude              # /opt/km/shims/claude — the shim wins PATH
#   km-env list                    # key NAMES only, never values
#   km-env exec --as claude -- env | grep API_KEY   # ANTHROPIC only
#   km-env exec --as codex  -- env | grep API_KEY   # OPENAI only
#   km-env exec --as nobody -- env                  # refused: unknown consumer
#   km logs <id> | grep secret_unseal                # audited, names + pid, no values
#
# WHAT THIS IS NOT. The broker is a LOGGED DOOR, not a wall. uid sandbox must
# reach the socket for any of this to work, so anything running as that uid can
# speak the protocol directly; peer credentials are attribution, not
# authorization. `grants` is blast-radius hygiene and audit legibility, NOT
# containment — a bare `km-env exec -- sh` still gets the full bundle. And on
# `privileged: true` none of it holds, since the agent can stop the daemon or
# read the ciphertext itself. The real control is `privileged: false`, which is
# why this demo sets it.
apiVersion: klankermaker.ai/v1alpha2
kind: SandboxProfile
metadata:
  name: brokered-secrets-demo
  labels:
    tier: development
    tool: brokered-secrets-demo
  prefix: bsec

extends:
  - base/os/redhat
  - base/network/safenetwork
  - base/userinit
  - base/platform

spec:
  lifecycle:
    ttl: "2h"
    idleTimeout: "20m"
    teardownPolicy: destroy

  runtime:
    substrate: ec2
    instanceType: t3.medium
    region: us-east-1
    spot: true

  execution:
    shell: /bin/bash
    workingDir: /workspace
    useBedrock: false
    # Deliberate: on privileged: true the agent can stop km-secretsd, rewrite the
    # shims, or read the ciphertext and call KMS itself. privileged: false is the
    # control that actually holds.
    privileged: false

  sourceAccess:
    mode: allowlist
    github:
      allowedRepos:
        - "*"

  secrets:
    # Path is relative to THIS FILE -> profiles/secrets/brokered-demo.enc.yaml
    sopsFile: ./secrets/brokered-demo.enc.yaml

    # Each key is BOTH the binary intercepted on PATH (a shim is generated at
    # /opt/km/shims/<name>) AND the identity presented to the broker.
    #
    # Omit `grants` entirely and the default applies: claude and codex each
    # receive the WHOLE bundle — the same effective grant as Phase 89, just
    # scoped to one process instead of every login shell.
    #
    # A name here whose binary is absent at boot is a WARNING, not a failure:
    # no shim is generated, so nothing is silently broken.
    grants:
      claude: [ANTHROPIC_API_KEY]
      codex: [OPENAI_API_KEY]
