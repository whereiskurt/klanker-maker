# Demo profile for the OTHER half of Phase 133: a NON-AGENT secret consumer.
#
# WHY THIS EXISTS. The shims in /opt/km/shims cover claude and codex. They do
# nothing for a script, a systemd unit, or an initCommand that needs a secret —
# and that gap is not hypothetical: four shipped profiles kept `grep`ing the
# now-deleted /etc/sandbox-secrets.env under `|| true`, so their token simply
# went missing and the real failure surfaced much later as an unrelated error.
# This profile is the worked example of the supported replacement, matching
# docs/brokered-secrets.md § "Migrating a non-agent secret consumer".
#
# THE PATTERN. `km-env exec --only KEY[,KEY2] -- <cmd>` unseals into exactly one
# child process. Three properties make it the right tool here:
#   * --only narrows the request further than the consumer's grant; it can never
#     widen it (the effective set is an intersection).
#   * the secret lives in that one child's environment and nowhere else — not in
#     the calling shell, not on disk.
#   * a broker failure is a NON-ZERO exit and the wrapped command is NEVER run,
#     so the failure is loud and local instead of a confusing error later.
#
# ORDERING. userdata installs and starts km-secretsd (§5.5) strictly BEFORE it
# runs initCommands (§7.5), and both are in the same `set -euo pipefail` script.
# So km-env is available here, and a broker that is installed but broken aborts
# the boot rather than producing a half-configured box.
#
# DO NOT WRAP THIS IN `|| true`. That is precisely the anti-pattern Phase 133
# removed. If the secret is genuinely optional, test for the key's absence
# explicitly — do not swallow the broker's exit code.
#
# BEFORE YOU RUN IT, create the bundle (path is relative to THIS FILE, so it
# resolves to profiles/secrets/initcmd-demo.enc.yaml). Run sops from OUTSIDE the
# repo: the repo's .sops.yaml creation rule matches the INPUT path, so
# encrypting from the repo root fails with "no matching creation rules found".
#
#   mkdir -p profiles/secrets
#   printf 'DEMO_API_TOKEN: t0k3n-example\n' > /tmp/ic.yaml
#   (cd /tmp && sops --encrypt \
#      --kms 'arn:aws:kms:us-east-1:<account-id>:alias/km-sandbox-secrets' \
#      --input-type yaml --output-type yaml ic.yaml) \
#      > profiles/secrets/initcmd-demo.enc.yaml
#   rm /tmp/ic.yaml
#
# VERIFY, once it is up:
#
#   km shell <id>
#   env | grep -c DEMO_API_TOKEN     # 0 — never in a shell
#   sudo cat /etc/demo/token.status  # written at boot by the initCommand below
#   km logs <id> | grep secret_unseal # one audited request, names + pid, no value
apiVersion: klankermaker.ai/v1alpha2
kind: SandboxProfile
metadata:
  name: brokered-secrets-initcmd-demo
  labels:
    tier: development
    tool: brokered-secrets-initcmd-demo
  prefix: bsic

extends:
  - base/os/redhat
  - base/network/safenetwork
  - base/userinit
  - base/platform

spec:
  lifecycle:
    ttl: "2h"
    idleTimeout: "20m"
    teardownPolicy: destroy

  runtime:
    substrate: ec2
    instanceType: t3.medium
    region: us-east-1
    spot: true

  execution:
    shell: /bin/bash
    workingDir: /workspace
    useBedrock: false
    privileged: false

    initCommandsAppend:
      # The supported non-agent pattern. Note what is deliberately ABSENT:
      # no `|| true`, and no redirect of the token into a file that would
      # recreate the plaintext-at-rest problem this phase removed. Only a
      # derived, non-secret fact is persisted.
      - |
        mkdir -p /etc/demo
        /opt/km/bin/km-env exec --only DEMO_API_TOKEN -- sh -c '
          if [ -n "$DEMO_API_TOKEN" ]; then
            # Use the token HERE, inside the one process that has it.
            # Persist only a non-secret outcome, never the value itself.
            printf "token-present len=%s\n" "${#DEMO_API_TOKEN}" > /etc/demo/token.status
          else
            echo "DEMO_API_TOKEN missing from the bundle" >&2
            exit 1
          fi
        '
        chmod 0644 /etc/demo/token.status

  sourceAccess:
    mode: allowlist
    github:
      allowedRepos:
        - "*"

  secrets:
    sopsFile: ./secrets/initcmd-demo.enc.yaml
    # No `grants:` here on purpose — this demonstrates the DEFAULT. Absent
    # grants, claude and codex each receive the whole bundle, and an explicit
    # `--only` (above) is how a non-agent consumer narrows its own request.
    # Compare with brokered-secrets-demo.yaml, which uses per-consumer grants.
