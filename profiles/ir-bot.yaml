apiVersion: klankermaker.ai/v1alpha2
kind: SandboxProfile
metadata:
  name: ir-bot
  labels:
    tier: security
    tool: ir-bot
  prefix: irbot

# The Slack default-route target (km-config.yaml slack.default_route). Anyone on
# the route's allow_emails can @-mention the bot from any channel they have
# invited it to, or DM it, and the turn lands here. Replies go back to the
# originating thread. See docs/slack-notifications.md § Default route.
#
# Bedrock on both knobs (see profiles/vulnhunt.yaml for why there are two):
# useBedrock provisions the box; cli.noBedrock: false makes the agent use it.
# A cold-created box has nobody around to run `claude login`, so Bedrock is the
# only authentication that works unattended.
extends:
  - base/os/redhat
  - base/network/safenetwork
  - base/userinit
  - base/platform
  - base/slack-persandbox

spec:
  lifecycle:
    ttl: "6h"
    idleTimeout: "45m"
    teardownPolicy: stop

  runtime:
    substrate: ec2
    instanceType: t3.large
    region: us-east-1
    spot: false

  execution:
    shell: /bin/bash
    workingDir: /workspace
    useBedrock: true

  sourceAccess:
    mode: none

  cli:
    noBedrock: false

  agent:
    default: claude

  notification:
    events:
      onIdle: false
      onPermission: false
    slack:
      channelName: "sb-{alias}"
      archiveOnDestroy: true
      inbound:
        enabled: true
        mentionOnly: true
        maxConcurrentThreads: 3
