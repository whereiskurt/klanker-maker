apiVersion: v1
kind: Config
clusters:
  # Inline CA data — the common case (EKS, and any internal CA).
  - name: inline-ca
    cluster:
      server: https://k8s1.corp:6443
      tls-server-name: api.k8s1.corp
      certificate-authority-data: SU5MSU5FLUNB
  # A CA on the operator's FILESYSTEM. The path does not exist on the sandbox,
  # so km must read and inline it rather than copy the path across.
  - name: file-ca
    cluster:
      server: https://k8s1.corp:6443
      certificate-authority: CA_FILE_PATH
  # No CA at all: a publicly-trusted cert, verified by the system trust store.
  - name: no-ca
    cluster:
      server: https://public.example.com
  # Operator has explicitly opted out of verification.
  - name: insecure
    cluster:
      server: https://k8s1.corp:6443
      insecure-skip-tls-verify: true
contexts:
  - name: inline-ca
    context: {cluster: inline-ca, user: u}
  - name: file-ca
    context: {cluster: file-ca, user: u}
  - name: no-ca
    context: {cluster: no-ca, user: u}
  - name: insecure
    context: {cluster: insecure, user: u}
users:
  - name: u
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubelogin
