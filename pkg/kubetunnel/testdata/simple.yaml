apiVersion: v1
kind: Config
clusters:
  - name: k8s1
    cluster:
      server: https://k8s1.corp:6443
      tls-server-name: k8s1.corp
contexts:
  - name: k8s1
    context:
      cluster: k8s1
      user: k8s1-oidc
users:
  - name: k8s1-oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubectl
        args:
          - oidc-login
          - get-token
