apiVersion: v1
kind: Config
clusters:
  - name: k8s1
    cluster:
      server: https://SHOULD-NOT-WIN.example.com:9999
      tls-server-name: should-not-win.example.com
  - name: k8s2
    cluster:
      server: https://k8s2.corp:6443
      tls-server-name: k8s2.corp
contexts:
  - name: k8s2
    context:
      cluster: k8s2
      user: k8s2-oidc
users:
  - name: k8s2-oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubelogin
        args:
          - get-token
