apiVersion: v1
kind: Config
clusters:
  - name: nosni
    cluster:
      server: https://k8s1.corp:6443
  - name: noport
    cluster:
      server: https://k8s1.corp
  - name: plainhttp
    cluster:
      server: http://k8s1.corp:8080
contexts:
  - name: nosni
    context:
      cluster: nosni
      user: k8s1-oidc
  - name: noport
    context:
      cluster: noport
      user: k8s1-oidc
  - name: plainhttp
    context:
      cluster: plainhttp
      user: k8s1-oidc
  - name: missing-cluster
    context:
      cluster: ghost
      user: k8s1-oidc
  - name: missing-user
    context:
      cluster: nosni
      user: ghost
  - name: no-exec
    context:
      cluster: nosni
      user: basic-user
users:
  - name: k8s1-oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubectl
        args:
          - oidc-login
          - get-token
  - name: basic-user
    user:
      token: abc123
