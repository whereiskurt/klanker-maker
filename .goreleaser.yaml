# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: km

# Run BEFORE the build matrix: fetch terraform + terragrunt for every target
# platform into .extras/{os}_{arch}/ so the archive step can include them.
# (.extras lives OUTSIDE dist/ — goreleaser 2.x cleans dist/ then errors if a
# before-hook repopulates it: "dist is not empty".)
before:
  hooks:
    # FIRST, so a dirty tree fails before the multi-hundred-MB tool fetch below.
    # The infra/**/*.hcl and infra/**/*.tf globs in the archive cannot exclude
    # .terragrunt-cache/ or .terraform/ — see scripts/check-release-tree.sh.
    - bash scripts/check-release-tree.sh
    - go mod tidy
    - bash scripts/fetch-bundled-tools.sh 1.9.8 0.99.1
    # Lambda deployment zips, published as a standalone asset (see extra_files
    # below) rather than bundled into the per-platform archives: they are
    # linux/arm64 regardless of the operator's platform, and four copies of
    # 217MB in every archive would be absurd. containers/operator/Dockerfile
    # downloads this so the image can run `km init --plan` — the Lambda-owning
    # terragrunt modules call filebase64sha256() on these at PLAN time.
    - bash scripts/build-release-lambdas.sh 1.9.8 .extras/lambdas.tar

builds:
  - id: km
    main: ./cmd/km
    binary: km
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/whereiskurt/klanker-maker/pkg/version.Number=v{{ .Version }}
      - -X github.com/whereiskurt/klanker-maker/pkg/version.GitCommit={{ .ShortCommit }}

archives:
  - id: km-bundle
    ids: [km]
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.xz]
    # Bundle the per-platform third-party binaries fetched by the before-hook.
    # {{ .Os }} / {{ .Arch }} are evaluated PER archive, so each tarball
    # gets only its own platform's toolchain.
    files:
      - src: .extras/{{ .Os }}_{{ .Arch }}/terraform
        dst: bin/terraform
        info:
          mode: 0755
      - src: .extras/{{ .Os }}_{{ .Arch }}/terragrunt
        dst: bin/terragrunt
        info:
          mode: 0755
      - LICENSE*
      - README.md
      - OPERATOR-GUIDE.md
      - src: .extras/THIRD-PARTY-LICENSES.txt
        dst: THIRD-PARTY-LICENSES.txt
      # Turn-key container build. These keep their REPO-RELATIVE paths inside
      # the archive on purpose: the same Dockerfile and the same build command
      # then work from a git clone and from an extracted tarball, with no second
      # copy of the file to drift. The Dockerfile downloads km from the GitHub
      # release rather than using the adjacent binary — required, since the
      # darwin archives carry a darwin binary that cannot go in a linux image.
      - containers/operator/Dockerfile
      - containers/operator/Dockerfile.dockerignore
      - containers/operator/README.md
      - src: containers/operator/entrypoint.sh
        dst: containers/operator/entrypoint.sh
        info:
          mode: 0755
      # Starting-point config (km-config.yaml itself is gitignored) and the
      # profile library the container copies in.
      - docs/km-config.example.yaml
      # Two globs per type on purpose: `profiles/**/*.yaml` matches only NESTED
      # files, so without the `profiles/*.yaml` partner every top-level leaf
      # profile (spot, desktop, github, every gpu-*) is silently absent from the
      # archive. Extension-scoped rather than `**/*` so gitignored local build
      # detritus (__pycache__, .pytest_cache, .DS_Store) stays out of a public
      # release. Types here match the tracked set under profiles/.
      - profiles/*.yaml
      - profiles/**/*.yaml
      - profiles/*.txt
      - profiles/**/*.txt
      - profiles/**/*.py
      # Named rather than globbed: `profiles/**/*.md` also drags in
      # .pytest_cache/README.md from a local test run.
      - profiles/checks/_bootstrap/KM_CHECK_TRIGGER.schema.md
      - profiles/secrets/README.md
      # The terragrunt tree (~1.3MB). Needed by containers/operator/Dockerfile,
      # which copies it to /klanker-maker/infra so `km init --plan` and
      # `km init --dry-run` name real module directories — without it the image
      # can only be built from a git clone, and the build-from-tarball path
      # advertised in containers/operator/README.md breaks.
      # Extension-scoped, mirroring the profiles globs above. NOTE: unlike the
      # profiles globs, extension-scoping does NOT keep a local .terraform/ or
      # .terragrunt-cache/ out of the archive — those directories are full of
      # exactly .hcl and .tf files (a rendered backend.tf, main.tf and
      # terragrunt.hcl per cached unit), so these two globs match straight into
      # them. A local snapshot picked up 528 such files, carrying the state
      # bucket, lock table and state key for every unit.
      #
      # goreleaser's globs have no negation, and narrowing these by directory
      # depth would trade a loud failure for a silent one: a tracked file added
      # at an unexpected depth would simply vanish from the archive. So the
      # working tree is checked instead — see the check-release-tree.sh hook
      # above, which fails the build rather than publishing the cache.
      #
      # *.json is deliberately NOT globbed. The only JSON under infra/ is
      # infra/live/.secrets.json — tracked, empty today, and needed by nothing
      # here. A glob that would publish a file with that name to a public
      # release asset the moment someone puts something in it is not worth the
      # zero bytes it currently buys.
      - infra/**/*.hcl
      - infra/**/*.tf
      # infra/modules/ecs-spot-handler/v1.0.0/lambda/handler.py — module source,
      # not a build artifact. The ECS substrate is unused, but a module missing
      # a file it declares fails at plan time rather than being skipped.
      - infra/**/*.py

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_checksums.txt"
  algorithm: sha256
  # The lambdas asset must appear here, not just in release.extra_files:
  # containers/operator/Dockerfile gates its download on
  # `sha256sum -c --ignore-missing`, and --ignore-missing silently passes when
  # the file has NO line in the checksums file. Absent this entry the image
  # would happily build on a truncated download.
  extra_files:
    - glob: .extras/lambdas.tar
      name_template: "{{ .ProjectName }}_v{{ .Version }}_lambdas.tar"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^Merge '

release:
  github:
    owner: whereiskurt
    name: klanker-maker
  draft: true
  prerelease: auto
  name_template: "km v{{ .Version }}"
  # linux/arm64 Lambda deployment zips, consumed by
  # containers/operator/Dockerfile so the image can run `km init --plan`.
  # Attached once as its own asset rather than duplicated into all four
  # platform archives.
  extra_files:
    - glob: .extras/lambdas.tar
      name_template: "{{ .ProjectName }}_v{{ .Version }}_lambdas.tar"
  header: |
    ## Klanker Maker v{{ .Version }}

    Single-archive download (xz-compressed): includes `km`, `terraform` v1.9.8, and `terragrunt` v0.99.1.

    ### Install — native
    ```
    tar -xJf km_v{{ .Version }}_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.xz
    sudo install -m 0755 km /usr/local/bin/km
    sudo install -m 0755 bin/terraform bin/terragrunt /usr/local/bin/
    km doctor
    ```

    You still need: `aws` CLI + `session-manager-plugin` (operator-provided).

    ### Install — container (nothing to install locally but Docker)

    ```
    docker run --rm -it \
      -v "$HOME/.aws:/root/.aws" \
      -v "$PWD/km-config.yaml:/klanker-maker/km-config.yaml" \
      ghcr.io/whereiskurt/klanker-maker/km:v{{ .Version }}
    ```

    Multi-arch (amd64 + arm64). Lands you in a shell at `/klanker-maker` where
    `./km create ...` works; or append a command to run one-shot:
    `docker run ... ghcr.io/whereiskurt/klanker-maker/km ./km list`.

    Add `-v "$HOME/.km:/root/.km"` to reuse your per-sandbox SSH keys,
    `-v "$PWD/profiles:/root/.km/profiles"` to layer your own profiles over the
    built-in library, and `-v "$PWD:/work"` for output that outlives the
    container.

    ### Build the container yourself

    This archive also carries everything the image build needs. Extract it and
    build in place — no `git clone`, no `make`:

    ```
    mkdir -p km-v{{ .Version }}
    tar -xJf km_v{{ .Version }}_linux_$(uname -m | sed 's/x86_64/amd64/').tar.xz -C km-v{{ .Version }}
    cd km-v{{ .Version }}
    docker build -f containers/operator/Dockerfile \
      --build-arg KM_VERSION=v{{ .Version }} -t km .

    docker run --rm -it \
      -v "$HOME/.aws:/root/.aws" \
      -v "$PWD/km-config.yaml:/klanker-maker/km-config.yaml" \
      km
    ```

    The image bundles `aws` CLI v2, `session-manager-plugin`, and `sops`, and
    lands you in a shell at `/klanker-maker` with `km` and the profile library
    ready. Credentials are never baked in — they come from the mounted
    `~/.aws`. Drop `--build-arg` to track the newest release instead of pinning
    to this one.

    Covers `--remote` sandbox work (create, list, shell, agent, logs, destroy,
    doctor) plus read-only platform inspection: `km init --dry-run`,
    `km init --plan`, and `km bootstrap --plan` run real terragrunt plans
    against your account. Applying — `km init --dry-run=false`,
    `km bootstrap`, `--local` create/destroy — belongs on the native install
    above: it shells out to `go build` at run time and pushes ECR images.
    Details: `containers/operator/README.md`.
    {{ with index .Env "KM_RELEASE_HIGHLIGHTS" }}

    {{ . }}
    {{ end }}
  footer: |
    ---
    `terraform` is distributed under HashiCorp's Business Source License 1.1.
    See `THIRD-PARTY-LICENSES.txt` in the archive for full attribution.
